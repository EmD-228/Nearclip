# Checks every push and pull request on Linux, and builds the installers for
# every push. This is how the project gets Windows and Linux builds without
# those machines.
#
# Work lands on `staging`, which only builds. Anything that reaches `main` is
# released: it is tagged `v<version>`, published as a GitHub release and sent
# to Google Play, all on its own. So never merge into `main` without bumping
# the version in src-tauri/tauri.conf.json — Play refuses a bundle whose
# versionCode is not higher than the last, and the run turns red.
#
# macOS bundles are ad hoc signed, Windows and Linux ones unsigned. The
# Android APK is signed only when the repository has the secrets
# ANDROID_KEYSTORE_B64 (base64 of the .jks) and ANDROID_KEYSTORE_PASSWORD;
# otherwise the job builds an unsigned APK as a compile check.
#
# Play needs the secret PLAY_SERVICE_ACCOUNT_JSON, a service account key with
# release rights. The release notes come from distribution/whatsnew, which has
# to be rewritten for each version; see docs/play-store.md.
name: Build

on:
  push:
    branches: [main, staging]
  pull_request:
  workflow_dispatch:
    inputs:
      play_track:
        description: "Google Play track (alpha, beta, production)"
        default: alpha

# Read-only token everywhere except the release job.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A release run is never cancelled halfway: Play would keep the upload.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The required status check for pull requests; keep the name stable.
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/install-linux-deps.sh
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      # One version in three files. A merge to main releases whatever
      # tauri.conf.json says, and nobody would notice a forgotten Cargo.toml
      # until a user read the wrong number in an installed build.
      - run: |
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          pkg=$(jq -r .version package.json)
          crate=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "tauri.conf.json $conf, package.json $pkg, Cargo.toml $crate"
          [ "$conf" = "$pkg" ] && [ "$conf" = "$crate" ]
      - run: pnpm check
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  desktop:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: dmg
            files: src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            bundles: nsis
            files: src-tauri/target/release/bundle/nsis/*.exe
          # The oldest supported Ubuntu: an AppImage runs on distributions
          # with a glibc at least as new as the one it was built against.
          - os: ubuntu-22.04
            bundles: appimage
            files: src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sh scripts/install-linux-deps.sh
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: nearclip-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  android:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.name.outputs.tag }}
    env:
      NDK_VERSION: 28.2.13676358
      APK_DIR: src-tauri/gen/android/app/build/outputs/apk/universal/release
    steps:
      - uses: actions/checkout@v4
      - env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > src-tauri/gen/android/nearclip-release.jks
          printf 'storeFile=nearclip-release.jks\nstorePassword=%s\n' "$KEYSTORE_PASSWORD" > src-tauri/gen/android/keystore.properties
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # The runner image ships this NDK; the install only runs if that changes.
      # ANDROID_HOME is a runner variable, invisible to ${{ env }} expressions.
      - run: |
          ndk="$ANDROID_HOME/ndk/$NDK_VERSION"
          test -d "$ndk" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri android build --apk --target aarch64
      # Play takes a bundle, not an APK, and splits it per device itself. Built
      # only for releases: it costs a second compile, for 32-bit phones too.
      - if: github.ref == 'refs/heads/main'
        run: pnpm tauri android build --aab --target aarch64 --target armv7
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: nearclip-android-bundle
          path: src-tauri/gen/android/app/build/outputs/bundle/*/*.aab
          if-no-files-found: error
      # Same naming as the desktop installers; an unsigned build keeps its
      # suffix. The tag the release is published under comes from here too, so
      # the installers and the tag can never disagree about the version.
      - id: name
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          for f in "$APK_DIR"/app-universal-release*.apk; do
            mv "$f" "$APK_DIR/NearClip_${version}_android${f#*app-universal-release}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: nearclip-android-arm64
          path: ${{ env.APK_DIR }}/*.apk
          if-no-files-found: error

  # Sends the bundle to Google Play. Skipped, quietly, when the repository has
  # no service account key, so a fork never tries to publish. The track is the
  # closed test; running the workflow by hand on main aims at another one.
  play:
    if: github.ref == 'refs/heads/main'
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nearclip-android-bundle
          path: bundle
      - id: key
        env:
          PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: echo "present=${{ env.PLAY_KEY != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.key.outputs.present == 'true'
        uses: r0adkll/upload-google-play@eb49699984a39f23558439581660aa6f088acfd6 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.nearclip
          releaseFiles: bundle/*/*.aab
          track: ${{ inputs.play_track || 'alpha' }}
          status: completed
          whatsNewDirectory: distribution/whatsnew

  # Tags the merged commit and publishes the installers under that tag, so the
  # version in tauri.conf.json is the only thing anyone has to bump. A manual
  # run only moves a build between Play tracks, and leaves the release alone.
  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nearclip-*
          merge-multiple: true
          path: dist
      # `*_android.apk` leaves out an unsigned `*_android-unsigned.apk`.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.android.outputs.tag }}
          name: NearClip ${{ needs.android.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*_android.apk
