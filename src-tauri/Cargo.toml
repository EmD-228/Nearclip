[package]
name = "nearclip"
version = "0.1.0"
description = "LAN-only encrypted clipboard sharing between your devices"
authors = ["Edomatch"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nearclip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-log = "2"
tokio = { version = "1.53.1", features = ["net", "io-util", "time", "sync", "macros", "rt-multi-thread"] }
mdns-sd = "0.21.3"
aes-gcm = "0.11.1"
hkdf = "0.13.0"
sha2 = "0.11.0"
getrandom = "0.4.3"
hex = "0.4.3"
base64 = "0.23.1"
thiserror = "2.0.20"
hostname = "0.4.2"
log = "0.4.34"
ed25519-dalek = { version = "3.0.0", features = ["serde"] }
x25519-dalek = { version = "3.0.0", features = ["getrandom", "static_secrets"] }
uuid = { version = "1.26.1", features = ["v4", "serde"] }
if-addrs = "0.15.0"
tauri-plugin-clipboard-manager = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
tauri-plugin-sharehub = "0.1.3"
